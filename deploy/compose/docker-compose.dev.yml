# Development stack (Phases 03–04): PostgreSQL 18.6 and Keycloak 26.8 (dev OIDC), loopback only. Development credentials only —
# never reuse them anywhere else. Start: docker compose -f deploy/compose/docker-compose.dev.yml up -d
name: qews-dev

services:
  postgres:
    # Same digest as the integration tests (apps/control-plane/src/__tests__/postgres.ts).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: qews
      # Superuser and migrator in development. Production uses a separate migrator role (06 §5).
      POSTGRES_USER: qews
      POSTGRES_PASSWORD: devonly
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - qews-pg:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qews -d qews']
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    # Development identity provider (Phase 04). Realm, users and client secret are dev-only fixtures; the
    # corporate IdP replaces it by configuration in Phase 12. Same image as the OIDC integration test.
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ['start-dev', '--import-realm', '--http-port=8081']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: devonly
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - ./keycloak/realm-qe.json:/opt/keycloak/data/import/realm-qe.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3',
        ]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  qews-pg: {}
